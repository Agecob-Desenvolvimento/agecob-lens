name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pandas 3 / numpy 2.4 require Python >= 3.11; README "3.8+" is stale.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agecob-lens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agecob-lens/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking until the existing 8 eslint errors and 16 type errors are fixed; flip to blocking after.
    continue-on-error: true
    defaults:
      run:
        working-directory: agecob-lens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agecob-lens/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        # Root tsconfig has "files": [] so `npm run check` checks nothing.
        if: success() || failure()
        run: npx tsc --noEmit -p tsconfig.app.json
