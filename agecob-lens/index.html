<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/logo-empresa.png" />
    <title>AgDash</title>
    <meta name="description" content="AgDash — Dashboard SpecOps Supervisor" />
    <meta name="author" content="Agecob" />

    <meta property="og:title" content="AgDash" />
    <meta property="og:description" content="AgDash — Dashboard SpecOps Supervisor" />
    <meta property="og:type" content="website" />

    <!-- Aplica o tema antes do primeiro paint; sem isso o SPA pisca claro antes do React montar. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("agdash-theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage bloqueado: segue no tema claro */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
